name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  semgrep-fixed:
    name: Semgrep fixed app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Scan fixed app
        run: >-
          semgrep scan --config p/owasp-top-ten --error
          --exclude-rule python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host
          --json-output semgrep-fixed.json
          --sarif-output semgrep-fixed.sarif
          web_app_fixed

      - name: Upload fixed-app reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-fixed-reports
          path: |
            semgrep-fixed.json
            semgrep-fixed.sarif
          if-no-files-found: warn

  semgrep-vulnerable:
    name: Semgrep vulnerable app (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Scan vulnerable app
        run: >-
          semgrep scan --config p/owasp-top-ten
          --json-output semgrep-vulnerable.json
          --sarif-output semgrep-vulnerable.sarif
          web_app

      - name: Upload vulnerable-app reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-vulnerable-reports
          path: |
            semgrep-vulnerable.json
            semgrep-vulnerable.sarif
          if-no-files-found: warn

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: semgrep-fixed
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vulnerable
            context: web_app
            image: owasp-top10-vulnerable
          - name: fixed
            context: web_app_fixed
            image: owasp-top10-fixed
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.namespace }}/${{ matrix.image }}:latest
            ${{ steps.image.outputs.namespace }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max